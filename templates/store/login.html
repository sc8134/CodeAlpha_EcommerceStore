{% extends 'base.html' %}
{% block title %}Login — Ecommerce Store{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-7 col-lg-5">
      <div class="card border-0 shadow-sm mt-3">
        <div class="card-body p-4 p-md-5">
          <h3 class="fw-bold text-center mb-4"><i class="bi bi-person-circle me-2 text-primary"></i>Login</h3>
          <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label fw-semibold">Username</label>
              <input type="text" name="username" class="form-control" placeholder="Enter username" autofocus required />
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Password</label>
              <input type="password" name="password" class="form-control" placeholder="Enter password" required />
            </div>
            <button type="submit" class="btn btn-dark w-100 btn-lg mb-3">Login</button>
          </form>
          <hr />
          <p class="text-center mb-0 text-muted">
            Don't have an account? <a href="/register/" class="fw-semibold text-dark">Register here</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
